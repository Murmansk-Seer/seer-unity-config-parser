name: Sync Upstream
'on':
  schedule:
  - cron: 37 * * * *
  workflow_dispatch:
    inputs:
      dry_run:
        description: Compare without pushing
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: sync-upstream-${{ github.repository }}
  cancel-in-progress: false
jobs:
  sync:
    uses: Murmansk-Seer/.github/.github/workflows/sync-identical-reusable.yml@2d68574bca0c4eca66a780df57b40b0668103906
    with:
      implementation_ref: 2d68574bca0c4eca66a780df57b40b0668103906
      dry_run: ${{ inputs.dry_run == true }}
