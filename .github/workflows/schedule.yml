name: Weekly Schedule Run

on:
  schedule:
    # 周五 12:00 / 14:00 (UTC+8)
    - cron: '0 4 * * 5'
    - cron: '0 6 * * 5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-start
  cancel-in-progress: false

jobs:
  run-start:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Node deps
        run: pnpm install --frozen-lockfile

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Test network budgets
        run: pnpm run test:network

      - name: Test current config layouts
        run: pnpm run test:config-layout

      - name: Test parser publication guards
        run: pnpm run test:pipeline-state

      - name: Record validated parser checkout
        run: echo "PARSER_BASE_REVISION=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Restore parser pipeline state
        uses: Murmansk-Seer/.github/.github/actions/pipeline-state@2d68574bca0c4eca66a780df57b40b0668103906
        with:
          mode: restore

      - name: Run task
        env:
          PARSER_REQUIRE_STATE: '1'
        run: pnpm start

      - name: Publish validated JSON changes
        run: python3 scripts/publish-parser-data.py

      - name: Publish successful parser inventory
        uses: Murmansk-Seer/.github/.github/actions/pipeline-state@2d68574bca0c4eca66a780df57b40b0668103906
        with:
          mode: publish
          message: |
            state(parser): record successful configuration inventory

            EN reason/scope: Persist only the canonical output inventory after strict parsing and successful data publication. Verification: the shared action checks the expected predecessor, state-only paths and unchanged-tree skip.
            中文原因与范围：仅在严格解析及数据发布成功后保存规范化输出清单。验证：共享动作校验预期前驱、状态专属路径，并跳过相同文件树。
